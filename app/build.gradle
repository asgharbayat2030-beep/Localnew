plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localsms'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.localsms'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }

    signingConfigs {
        release {
            def keystoreFile = rootProject.file("localsms-release.jks")
            storeFile keystoreFile
            storePassword System.getenv("LOCALSMS_KEYSTORE_PASSWORD")
            keyAlias "localsms"
            keyPassword System.getenv("LOCALSMS_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
}
