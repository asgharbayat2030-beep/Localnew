name: Build Local Device Manager v4 Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Verify Android project files
        run: |
          echo "=== Resource files ==="
          find app/src/main/res -maxdepth 3 -type f -print
          echo "=== Java files ==="
          find app/src/main/java -maxdepth 6 -type f -print
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/java/com/localsms/server/LocalServer.java

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.LOCALSMS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Missing LOCALSMS_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > localsms-release.jks

      - name: Build signed Release APK
        env:
          LOCALSMS_KEYSTORE_PASSWORD: ${{ secrets.LOCALSMS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$LOCALSMS_KEYSTORE_PASSWORD" ]; then
            echo "Missing LOCALSMS_KEYSTORE_PASSWORD repository secret."
            exit 1
          fi
          gradle clean assembleRelease --no-daemon --stacktrace --console=plain

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalDeviceManager-v4-release
          path: app/build/outputs/apk/release/app-release.apk
